[build-system]
# 77+ is what implements PEP 639 (SPDX license expressions, License-Expression).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fck"
version = "0.1.0"
description = "A mindfulness and wellbeing framework for people who are done."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Tomáš Cerman", email = "t.cerman@gmail.com" }]
# PEP 639: an SPDX expression, not a table. Must NOT be paired with a
# "License :: ..." trove classifier -- setuptools rejects that combination.
license = "MIT"
license-files = ["LICENSE"]
keywords = ["profanity", "swearing", "stress", "humour", "satire", "cli"]
classifiers = [
    # No "License :: ..." entry here on purpose: setuptools rejects a trove
    # license classifier alongside the SPDX expression above.
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Pivso/fck"
Repository = "https://github.com/Pivso/fck"
Issues = "https://github.com/Pivso/fck/issues"

[project.scripts]
fck = "fck.__main__:main"

[tool.setuptools]
packages = ["fck"]

[tool.setuptools.package-data]
fck = ["py.typed"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fck"
version = "0.1.0"
description = "A mindfulness and wellbeing framework for people who are done."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
fck = "fck.__main__:main"

[tool.setuptools]
packages = ["fck"]

[tool.setuptools.package-data]
fck = ["py.typed"]

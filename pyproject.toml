[build-system]
# 77+ is what implements PEP 639 (SPDX license expressions, License-Expression).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fck"
version = "0.1.0"
description = "A mindfulness and wellbeing framework for people who are done."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Tomáš Cerman", email = "t.cerman@gmail.com" }]
# PEP 639: an SPDX expression, not a table. Must NOT be paired with a
# "License :: ..." trove classifier -- setuptools rejects that combination.
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
fck = "fck.__main__:main"

[tool.setuptools]
packages = ["fck"]

[tool.setuptools.package-data]
fck = ["py.typed"]
